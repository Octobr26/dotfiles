# Styling + Colors
#set -g default-terminal "tmux-256color"

# Change prefix from Ctrl-b to Ctrl-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Easier pane splits
unbind '"'
unbind %
bind - split-window -v
bind | split-window -h

# Vim-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Easier pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Better defaults
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position bottom

# status bar styling — Catppuccin Mocha, warm accents (peach/maroon/yellow)
set -g status-style 'bg=#181825,fg=#cdd6f4'
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80

# left: session name pill (peach)
set -g status-left '#[fg=#1e1e2e,bg=#fab387,bold] #S #[fg=#fab387,bg=#181825]#[default] '

# right: date + time pills (surface / yellow)
set -g status-right '#[fg=#6c7086,bg=#181825]#[fg=#cdd6f4,bg=#313244] %a %d %b #[fg=#f9e2af,bg=#313244]#[fg=#1e1e2e,bg=#f9e2af,bold] %H:%M '

# inactive windows
set-window-option -g window-status-style 'fg=#6c7086,bg=#181825'
set-window-option -g window-status-format '#{?#{==:#{window_name},ai},#(tmux-ai-window-status "#{window_id}" "#{window_index}" "#{window_name}"), #I #W }'

# active window (maroon pill)
set-window-option -g window-status-current-style 'fg=#1e1e2e,bg=#eba0ac,bold'
set-window-option -g window-status-current-format '#{?#{==:#{window_name},ai},#(tmux-ai-window-status "#{window_id}" "#{window_index}" "#{window_name}"), #I #W }'
set -g status-interval 2

# AI status is inferred from visible pane prompts, not tmux activity flags.
setw -g monitor-activity off
set -g activity-action none
set -g visual-activity off

# pane borders — labeled, heavy divider, bright active border
set -g pane-border-status top
set -g pane-border-lines double
set -g pane-border-format '#{?pane_active,#[fg=#fab387#,bold],#[fg=#6c7086]} #{pane_index}: #{pane_title} #[default]'

set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#fab387,bold'

# dim the inactive pane so the focused tool visibly pops
set -g window-style        'fg=#7f849c,bg=#0c0c12'
set -g window-active-style 'fg=#cdd6f4,bg=#1e1e2e'

# name a pane (shown on its border):  prefix + R
bind R command-prompt -p 'pane name:' "select-pane -T '%%'"

# messages / command line
set -g message-style 'fg=#1e1e2e,bg=#f9e2af,bold'

#reload tmux
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
