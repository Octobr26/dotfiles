# Styling + Colors
#set -g default-terminal "tmux-256color"

# Change prefix from Ctrl-b to Ctrl-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Easier pane splits
unbind '"'
unbind %
bind - split-window -v
bind | split-window -h

# Vim-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Match the default pane-kill shortcut, but target the current session.
bind X confirm-before -p 'kill-session #S? (y/n)' kill-session

# Easier pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Better defaults
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position top
set -g status on

# status bar styling — Gruvbox Dark
set -g status-style 'bg=#282828,fg=#ebdbb2'
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 100

# left: session name pill (orange)
set -g status-left '#[fg=#282828,bg=#fe8019,bold] #S #[fg=#fe8019,bg=#282828]#[default] '

# right: focused project + active preview directory + date + time pills
set -g status-right '#[fg=#282828,bg=#83a598,bold]#{?#{@pane_project}, #{@pane_project} ,}#[fg=#ebdbb2,bg=#3c3836,nobold] %a %d %b #[fg=#fabd2f,bg=#3c3836]#[fg=#282828,bg=#fabd2f,bold] %H:%M '

# AI attention: Codex lifecycle hooks and a Claude/screen fallback classify
# working, blocked, done, or idle. Sounds only play for background panes.
run-shell -b 'tmux-ai-attention'

# Tabs follow the pane-label rule: the fill means focus, the glyph colour
# means state, and only `blocked` is loud enough to fill on its own.
# The format sets no fg/bg outside the glyph and the blocked chip, so
# #[default] resolves to each window's own style. Hard-coding them here is
# what previously made window-status-current-style dead code.
# inactive windows
set-window-option -g window-status-style 'fg=#928374,bg=#282828'
set-window-option -g window-status-format '#{?@ai_state,#{?#{==:#{@ai_state},blocked},#[fg=#fb4934]#[bg=#282828]#[fg=#282828]#[bg=#fb4934]#[bold] ! #I #W #[fg=#fb4934]#[bg=#282828]#[default],#{?#{==:#{@ai_state},working}, #[fg=#fabd2f]●#[default] #I #W ,#{?#{==:#{@ai_state},done}, #[fg=#98971a]✓#[default] #I #W , #[fg=#928374]○#[default] #I #W }}}, #I #W }'

# active window (state-coloured pill)
# The focused format paints its own pill end to end, so this style only
# governs what #[default] restores to. Keep it neutral or a grey block
# trails the pill.
set-window-option -g window-status-current-style 'fg=#928374,bg=#282828'
set-window-option -g window-status-current-format '#{?@ai_state,#{?#{==:#{@ai_state},blocked},#[fg=#fb4934]#[bg=#282828]#[fg=#282828]#[bg=#fb4934]#[bold] ! #I #W #[fg=#fb4934]#[bg=#282828]#[default],#{?#{==:#{@ai_state},working},#[fg=#fabd2f]#[bg=#282828]#[fg=#282828]#[bg=#fabd2f]#[bold] ● #I #W #[fg=#fabd2f]#[bg=#282828]#[default],#{?#{==:#{@ai_state},done},#[fg=#b8bb26]#[bg=#282828]#[fg=#282828]#[bg=#b8bb26]#[bold] ✓ #I #W #[fg=#b8bb26]#[bg=#282828]#[default],#[fg=#8ec07c]#[bg=#282828]#[fg=#282828]#[bg=#8ec07c]#[bold] ○ #I #W #[fg=#8ec07c]#[bg=#282828]#[default]}}},#[fg=#8ec07c]#[bg=#282828]#[fg=#282828]#[bg=#8ec07c]#[bold] #I #W #[fg=#8ec07c]#[bg=#282828]#[default]}'
set -g status-interval 2

# Show all tmux windows in a built-in picker.
bind a choose-tree -Zw

# Popups inherit the focused pane's directory and close when the app exits.
bind C-s display-popup -d "#{pane_current_path}" -w 90% -h 90% -E spotify_player
unbind t
bind t display-popup -d "#{pane_current_path}" -w 80% -h 80% -E '$SHELL -l'
bind y display-popup -d "#{pane_current_path}" -w 80% -h 80% -E lazygit

# Tree mode fills the pane, so hide its semantic header until the picker exits.
set-hook -g 'pane-mode-changed[90]' 'if-shell -F "#{==:#{pane_mode},tree-mode}" "set-option -p @tree_border_hidden 1 ; set-option -w pane-border-status off" "if-shell -F \"#{@tree_border_hidden}\" \"set-option -wu pane-border-status ; set-option -pu @tree_border_hidden\""'

# AI state uses Codex hooks or visible-pane fallback, not tmux activity flags.
setw -g monitor-activity off
set -g activity-action none
set -g visual-activity off

# Toggle AI request/completion sounds without disabling visual state tracking.
bind N if-shell -F '#{==:#{@ai_sound_enabled},off}' {
    set-option -gu @ai_sound_enabled
    display-message 'AI sounds: on'
} {
    set-option -g @ai_sound_enabled off
    display-message 'AI sounds: off'
}

# pane borders — live semantic labels, heavy divider, unmistakable focus
set -g pane-border-status top
set -g pane-border-lines double
# The semantic label already identifies each pane; edge arrows add visual noise.
set -g pane-border-indicators off
# The active pane is already unmistakable: pane-active-border-style paints its
# double border orange. A filled label block on top of that is redundant, so the
# label is typographic - dim index, bright bold tool name when focused.
# Only `blocked` fills a chip, because only `blocked` is waiting on the user.
# working, done and idle are a coloured glyph and nothing more.
set -g pane-border-format '#[align=left]#[fg=#928374] #{pane_index} #{?pane_active,#[fg=#ebdbb2]#[bold],#[fg=#928374]}#{?@pane_tool,#{@pane_tool},#{pane_current_command}}#[nobold]#{?#{&&:#{@agent_role},#{!=:#{@agent_role},agent}},#[fg=#928374] · #{=16:@agent_role},}#{?@pane_state,#{?#{==:#{@pane_state},blocked},  #[fg=#282828]#[bg=#fb4934]#[bold] #{?#{e|<:#{pane_width},60},!,! INPUT},#{?#{==:#{@pane_state},working},#[fg=#fe8019]  #{?#{e|<:#{pane_width},60},✳,✳ working},#{?#{==:#{@pane_state},done},#[fg=#98971a]  ✓,#[fg=#928374]  ○}}},} #[default]'

set -g pane-border-style 'fg=#504945'
set -g pane-active-border-style 'fg=#fe8019,bold'

# dim the inactive pane so the focused tool visibly pops
set -g window-style        'fg=#a89984,bg=#181818'
set -g window-active-style 'fg=#ebdbb2,bg=#282828'

# add an optional semantic role to the focused pane: prefix + R
bind R command-prompt -p 'pane role (blank hides):' "set-option -p @agent_role '%%'"

# messages / command line
set -g message-style 'fg=#282828,bg=#fabd2f,bold'

#reload tmux
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
