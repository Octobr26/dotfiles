# Styling + Colors
#set -g default-terminal "tmux-256color"

# Change prefix from Ctrl-b to Ctrl-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Easier pane splits
unbind '"'
unbind %
bind - split-window -v
bind | split-window -h

# Vim-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Easier pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Better defaults
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position top
set -g status 2
# A pane-coloured gutter keeps the top status pills separate from pane labels.
set -g 'status-format[1]' '#[fill=#0c0c12]'

# status bar styling — Catppuccin Mocha, warm accents (peach/maroon/yellow)
set -g status-style 'bg=#181825,fg=#cdd6f4'
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 100

# left: session name pill (peach)
set -g status-left '#[fg=#1e1e2e,bg=#fab387,bold] #S #[fg=#fab387,bg=#181825]#[default] '

# right: focused project + active preview directory + date + time pills
set -g status-right '#[fg=#1e1e2e,bg=#89b4fa,bold]#{?#{@pane_project}, #{@pane_project} ,}#[fg=#1e1e2e,bg=#a6e3a1,bold]#{?#{@worktree_preview_status}, #{@worktree_preview_status} ,}#[fg=#cdd6f4,bg=#313244,nobold] %a %d %b #[fg=#f9e2af,bg=#313244]#[fg=#1e1e2e,bg=#f9e2af,bold] %H:%M '

# AI attention: Codex lifecycle hooks and a Claude/screen fallback classify
# working, blocked, done, or idle. Sounds only play for background panes.
run-shell -b 'tmux-ai-attention'

# inactive windows
set-window-option -g window-status-style 'fg=#6c7086,bg=#181825'
set-window-option -g window-status-format '#{?@ai_state,#{?#{==:#{@ai_state},blocked},#[fg=#1e1e2e]#[bg=#fab387]#[bold] ! #I #W #[default],#{?#{==:#{@ai_state},working},#[fg=#1e1e2e]#[bg=#f9e2af]#[bold] ● #I #W #[default],#[fg=#1e1e2e]#[bg=#a6e3a1]#[bold] ✓ #I #W #[default]}}, #I #W }'

# active window (maroon pill)
set-window-option -g window-status-current-style 'fg=#1e1e2e,bg=#eba0ac,bold'
set-window-option -g window-status-current-format '#{?@ai_state,#{?#{==:#{@ai_state},blocked},#[fg=#1e1e2e]#[bg=#fab387]#[bold] ! #I #W #[default],#{?#{==:#{@ai_state},working},#[fg=#1e1e2e]#[bg=#f9e2af]#[bold] ● #I #W #[default],#[fg=#1e1e2e]#[bg=#a6e3a1]#[bold] ✓ #I #W #[default]}}, #I #W }'
set -g status-interval 2

# Show all tmux windows in a built-in picker.
bind a choose-tree -Zw

# AI state uses Codex hooks or visible-pane fallback, not tmux activity flags.
setw -g monitor-activity off
set -g activity-action none
set -g visual-activity off

# pane borders — live semantic labels, heavy divider, unmistakable focus
set -g pane-border-status top
set -g pane-border-lines double
# The semantic label already identifies each pane; edge arrows add visual noise.
set -g pane-border-indicators off
set -g pane-border-format '#{?pane_active,#[align=left]#[fg=#1e1e2e]#[bg=#fab387]#[bold],#[align=left]#[fg=#6c7086]#[bg=#181825]} #{pane_index} #{?@pane_tool,#{@pane_tool},#{pane_current_command}}#{?#{&&:#{@agent_role},#{!=:#{@agent_role},agent}}, · #{=16:@agent_role},}#{?@pane_state, · #{?#{==:#{@pane_state},blocked},#{?#{e|<:#{pane_width},60},!,! INPUT},#{?#{==:#{@pane_state},working},#{?#{e|<:#{pane_width},60},●,● working},#{?#{==:#{@pane_state},done},#{?#{e|<:#{pane_width},60},✓,✓ done},#{?#{e|<:#{pane_width},60},○,○ idle}}}},} #[default]'

set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#fab387,bold'

# dim the inactive pane so the focused tool visibly pops
set -g window-style        'fg=#7f849c,bg=#0c0c12'
set -g window-active-style 'fg=#cdd6f4,bg=#1e1e2e'

# add an optional semantic role to the focused pane: prefix + R
bind R command-prompt -p 'pane role (blank hides):' "set-option -p @agent_role '%%'"

# messages / command line
set -g message-style 'fg=#1e1e2e,bg=#f9e2af,bold'

#reload tmux
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
