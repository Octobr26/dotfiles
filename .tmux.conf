# Styling + Colors
#set -g default-terminal "tmux-256color"

# Change prefix from Ctrl-b to Ctrl-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Easier pane splits
unbind '"'
unbind %
bind - split-window -v
bind | split-window -h

# Vim-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Easier pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Better defaults
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position top
set -g status 2
# A pane-coloured gutter keeps the top status pills separate from pane labels.
set -g 'status-format[1]' '#[fill=#1d2021]'

# status bar styling — Gruvbox Dark
set -g status-style 'bg=#282828,fg=#ebdbb2'
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 100

# left: session name pill (orange)
set -g status-left '#[fg=#282828,bg=#fe8019,bold] #S #[fg=#fe8019,bg=#282828]#[default] '

# right: focused project + active preview directory + date + time pills
set -g status-right '#[fg=#282828,bg=#83a598,bold]#{?#{@pane_project}, #{@pane_project} ,}#[fg=#ebdbb2,bg=#3c3836,nobold] %a %d %b #[fg=#fabd2f,bg=#3c3836]#[fg=#282828,bg=#fabd2f,bold] %H:%M '

# AI attention: Codex lifecycle hooks and a Claude/screen fallback classify
# working, blocked, done, or idle. Sounds only play for background panes.
run-shell -b 'tmux-ai-attention'

# inactive windows
set-window-option -g window-status-style 'fg=#928374,bg=#282828'
set-window-option -g window-status-format '#{?@ai_state,#{?#{==:#{@ai_state},blocked},#[fg=#282828]#[bg=#fe8019]#[bold] ! #I #W #[default],#{?#{==:#{@ai_state},working},#[fg=#282828]#[bg=#fabd2f]#[bold] ● #I #W #[default],#[fg=#282828]#[bg=#b8bb26]#[bold] ✓ #I #W #[default]}}, #I #W }'

# active window (red pill)
set-window-option -g window-status-current-style 'fg=#282828,bg=#fb4934,bold'
set-window-option -g window-status-current-format '#{?@ai_state,#{?#{==:#{@ai_state},blocked},#[fg=#282828]#[bg=#fe8019]#[bold] ! #I #W #[default],#{?#{==:#{@ai_state},working},#[fg=#282828]#[bg=#fabd2f]#[bold] ● #I #W #[default],#[fg=#282828]#[bg=#b8bb26]#[bold] ✓ #I #W #[default]}}, #I #W }'
set -g status-interval 2

# Show all tmux windows in a built-in picker.
bind a choose-tree -Zw

# Tree mode fills the pane, so hide its semantic header until the picker exits.
set-hook -g 'pane-mode-changed[90]' 'if-shell -F "#{==:#{pane_mode},tree-mode}" "set-option -p @tree_border_hidden 1 ; set-option -w pane-border-status off" "if-shell -F \"#{@tree_border_hidden}\" \"set-option -wu pane-border-status ; set-option -pu @tree_border_hidden\""'

# AI state uses Codex hooks or visible-pane fallback, not tmux activity flags.
setw -g monitor-activity off
set -g activity-action none
set -g visual-activity off

# Toggle AI request/completion sounds without disabling visual state tracking.
bind N if-shell -F '#{==:#{@ai_sound_enabled},off}' {
    set-option -gu @ai_sound_enabled
    display-message 'AI sounds: on'
} {
    set-option -g @ai_sound_enabled off
    display-message 'AI sounds: off'
}

# pane borders — live semantic labels, heavy divider, unmistakable focus
set -g pane-border-status top
set -g pane-border-lines double
# The semantic label already identifies each pane; edge arrows add visual noise.
set -g pane-border-indicators off
set -g pane-border-format '#{?pane_active,#[align=left]#[fg=#282828]#[bg=#fe8019]#[bold],#[align=left]#[fg=#928374]#[bg=#282828]} #{pane_index} #{?@pane_tool,#{@pane_tool},#{pane_current_command}}#{?#{&&:#{@agent_role},#{!=:#{@agent_role},agent}}, · #{=16:@agent_role},}#{?@pane_state, · #{?#{==:#{@pane_state},blocked},#{?#{e|<:#{pane_width},60},!,! INPUT},#{?#{==:#{@pane_state},working},#{?#{e|<:#{pane_width},60},●,● working},#{?#{==:#{@pane_state},done},#[fg=#282828]#[bg=#b8bb26]#[bold]#{?#{e|<:#{pane_width},60},✓,✓ done},#{?#{e|<:#{pane_width},60},○,○ idle}}}},} #[default]'

set -g pane-border-style 'fg=#504945'
set -g pane-active-border-style 'fg=#fe8019,bold'

# dim the inactive pane so the focused tool visibly pops
set -g window-style        'fg=#a89984,bg=#1d2021'
set -g window-active-style 'fg=#ebdbb2,bg=#282828'

# add an optional semantic role to the focused pane: prefix + R
bind R command-prompt -p 'pane role (blank hides):' "set-option -p @agent_role '%%'"

# messages / command line
set -g message-style 'fg=#282828,bg=#fabd2f,bold'

#reload tmux
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
