customCommands:
  - key: "U"
    context: "localBranches"
    description: "Use branch for frontend preview"
    command: "worktree-preview use {{.SelectedLocalBranch.Name | quote}}"
    loadingText: "Switching frontend preview"
    output: "terminal"
  - key: "X"
    context: "global"
    description: "Stop frontend preview"
    command: "worktree-preview stop"
    loadingText: "Stopping frontend preview"
    output: "terminal"
