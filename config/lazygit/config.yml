customCommands:
  - key: "P"
    context: "worktrees"
    description: "Switch preview to selected worktree"
    command: "worktree-preview use {{.SelectedWorktree.Branch | quote}}"
    loadingText: "Switching frontend preview"
    output: "terminal"
  - key: "X"
    context: "global"
    description: "Stop frontend preview"
    command: "worktree-preview stop"
    loadingText: "Stopping frontend preview"
    output: "terminal"
    
